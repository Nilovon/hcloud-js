name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Type-check
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Validate package
        run: bun run lint:package
        working-directory: packages/library

  node:
    name: Node ${{ matrix.node }} smoke test
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run build:library

      # Switch Node.js after building, so only the runtime under test changes.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Import the built package (ESM and CommonJS)
        run: node packages/library/scripts/smoke-test.mjs
